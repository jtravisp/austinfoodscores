services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: afs
      POSTGRES_PASSWORD: afs
      POSTGRES_DB: afs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afs -d afs"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
