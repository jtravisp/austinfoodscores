# Merges to main: test -> plan prod -> [apply, only if the plan has changes,
# after your approval] -> deploy the site (no approval).
#
#   plan   read-only role. `-detailed-exitcode` says whether anything would
#          change; the bucket/distribution for the site job come from state.
#   apply  runs ONLY when infrastructure (or Lambda code) changes, gated by the
#          `production` environment (required reviewer). Review the plan in the
#          plan job's summary, then approve; apply uses that saved plan file, so
#          it applies what you reviewed or fails as stale. Runs migrations.
#   site   uploads frontend/ in the reviewer-free `production-site` environment
#          with the web-deploy role, which can only write the site bucket and
#          invalidate CloudFront. A frontend-only merge goes live with no approval.
name: deploy

on:
  push:
    branches: [main]
    # Docs-only merges don't need a prod plan at all.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two prod deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  ACCOUNT: "169406897968"
  TF_IN_AUTOMATION: "1"
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  plan:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      bucket: ${{ steps.site.outputs.bucket }}
      distribution: ${{ steps.site.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv run python scripts/build_lambda.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/afs-prod-github-plan
          aws-region: us-east-1
      - run: terraform -chdir=infra/envs/prod init -input=false
      - name: terraform plan
        id: plan
        # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
        run: |
          set +e
          terraform -chdir=infra/envs/prod plan -input=false -no-color -lock-timeout=120s -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: plan summary (review this before approving)
        run: |
          {
            echo "## Plan: prod"
            if [ "${{ steps.plan.outputs.changes }}" = "true" ]; then
              echo "Infrastructure changes below: the **apply** job is waiting for approval."
            else
              echo "No infrastructure changes: **apply** is skipped, and the site deploys without approval."
            fi
            echo '```'
            terraform -chdir=infra/envs/prod show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: site target (from state)
        id: site
        run: |
          echo "bucket=$(terraform -chdir=infra/envs/prod output -raw site_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform -chdir=infra/envs/prod output -raw distribution_id)" >> "$GITHUB_OUTPUT"
      # The plan and the zip it hashed travel to the apply job together.
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.changes == 'true'
        with:
          name: prod-plan
          path: |
            infra/envs/prod/tfplan
            build/lambda.zip
          retention-days: 1

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://austinfood.travispollard.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # Paths are kept relative to the repo root, so tfplan and lambda.zip land
      # back exactly where the plan job wrote them.
      - uses: actions/download-artifact@v8
        with:
          name: prod-plan
      - run: ls -la build/lambda.zip infra/envs/prod/tfplan
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      # Admin role: only assumable from jobs in the `production` environment.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/afs-prod-github-apply
          aws-region: us-east-1
      - run: terraform -chdir=infra/envs/prod init -input=false
      - name: terraform apply (the reviewed plan)
        run: terraform -chdir=infra/envs/prod apply -input=false -no-color tfplan
      - name: run migrations
        run: uv run afs remote-migrate --env prod --profile ""

  site:
    needs: [plan, apply]
    # Run after a successful apply, or when apply was skipped (no infra changes);
    # never after a failed or rejected apply.
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production-site
      url: https://austinfood.travispollard.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/afs-prod-github-web-deploy
          aws-region: us-east-1
      - name: deploy site
        run: >-
          uv run python scripts/deploy_site.py --env prod --profile ""
          --bucket ${{ needs.plan.outputs.bucket }} --distribution ${{ needs.plan.outputs.distribution }}
