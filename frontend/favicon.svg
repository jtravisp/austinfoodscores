<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Austin Food Scores cheeseburger. Original artwork for this project. -->
  <!-- top bun -->
  <path d="M5 34 C5 15 17 7 32 7 C47 7 59 15 59 34 Z" fill="#f0a63a" stroke="#a8621a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- sesame seeds -->
  <g fill="#fff3d1">
    <ellipse cx="21" cy="17" rx="2.6" ry="1.5" transform="rotate(-25 21 17)"/>
    <ellipse cx="32" cy="13" rx="2.6" ry="1.5"/>
    <ellipse cx="43" cy="17" rx="2.6" ry="1.5" transform="rotate(25 43 17)"/>
    <ellipse cx="27" cy="23" rx="2.6" ry="1.5" transform="rotate(-10 27 23)"/>
    <ellipse cx="38" cy="23" rx="2.6" ry="1.5" transform="rotate(10 38 23)"/>
  </g>
  <!-- lettuce -->
  <path d="M4 33 Q8 29 12 33 T20 33 T28 33 T36 33 T44 33 T52 33 T60 33 L60 37 L4 37 Z" fill="#46b04a" stroke="#2e7d32" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- patty -->
  <rect x="6" y="40" width="52" height="9" rx="4.5" fill="#6b3a1f" stroke="#40210f" stroke-width="2"/>
  <!-- cheese, drawn after the patty so it drips over it -->
  <path d="M5 36 H59 V40 H50 L46 46 L42 40 H24 L20 45 L16 40 H5 Z" fill="#ffcc2e" stroke="#c98e00" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- bottom bun -->
  <path d="M6 50 H58 V53 C58 57 55 59 51 59 H13 C9 59 6 57 6 53 Z" fill="#f0a63a" stroke="#a8621a" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
